server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;
    client_max_body_size 64M;
    charset utf-8;

    # NukeViet rewrite (official nginx template, adapted)
    if ($request_filename ~ /robots.txt$) {
        rewrite ^(.*)$ /robots.php?action=$http_host break;
    }
    rewrite ^/(.*?)install/check\.rewrite$ /install/rewrite.php break;
    rewrite ^/(.*?)sitemap\.xml$ /index.php?nv=SitemapIndex break;
    rewrite "^/(.*?)sitemap\-([a-z]{2})\.xml$" /index.php?language=$2&nv=SitemapIndex break;
    rewrite "^/(.*?)sitemap\-([a-z]{2})\.([a-zA-Z0-9-]+)\.xml$" /index.php?language=$2&nv=$3&op=sitemap break;

    if (!-e $request_filename) {
        rewrite (.*)(\/|\.html)$ /index.php;
        rewrite /(.*)tag/(.*)$ /index.php;
    }

    # Deny sensitive paths (allow /admin/index.php and static under /admin/)
    location ~ ^/admin/([a-z0-9]+)/(.*)$ { deny all; }
    location ~ ^/(config|includes|vendor)/(.*)$ { deny all; }
    location ~ ^/data/(cache|config|ip|ip6|logs)/(.*)$ { deny all; }
    location ~ ^/(files|uploads|themes)/(.*)\.(php|ini|tpl|php3|php4|php5|phtml|inc|pl|py|jsp|sh|cgi)$ { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
